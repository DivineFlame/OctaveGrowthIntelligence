# Per-service deploy.resources.limits (cpus/memory) below: previously
# unbounded, so one runaway container (a big Paperclip image job, an
# unbounded query, a memory leak) could starve every other service on
# the same VPS with no isolation between them. Compose V2 (the `docker
# compose` CLI, confirmed in use here) applies these as real container
# limits outside of Swarm too - values below are conservative starting
# points for a modest VPS, not measured under real load; raise them if
# a service gets OOM-killed (check `docker inspect <container> | grep
# -i oom`) or throttled.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
networks:
  frontend:
  backend:
    internal: true
  db:
    internal: true
volumes:
  pgdata:
  redisdata:
  recordings:
  clamav_data:
  paperclip_cache:
  pgbackups:
services:
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    volumes:
      - clamav_data:/var/lib/clamav
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [db]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orgcomms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orgcomms_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-secure.sql:/docker-entrypoint-initdb.d/init-secure.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
  # Automated daily pg_dump, running as its own container on the internal
  # `db` network (see postgres/backup/) - not reliant on a host crontab
  # (docker exec from the host still works too, see scripts/backup-vps.sh
  # for an on-demand backup, and scripts/restore-vps.sh to restore either
  # kind). 7-day local retention by default; ship pgbackups off-host too if
  # "the VPS itself is lost" needs to be a recoverable scenario.
  postgres-backup:
    build:
      context: ./postgres/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-orgcomms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orgcomms_prod}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      # Optional off-host backup shipping via rclone - unset by default (see
      # postgres/backup/backup.sh and README.md "Hardening notes"). Left
      # empty here, this is a no-op: backup.sh only attempts to ship when
      # it's set.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - pgbackups:/backups
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [db]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=50M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    # --bind 127.0.0.1 was the actual cause of the api container's endless
    # "Redis error ECONNREFUSED 172.30.0.2:6379" loop: binding to loopback
    # restricts redis-server to connections from *inside its own container*,
    # so every other service reaching it over the docker network (api, hermes)
    # as redis:6379 was refused at the TCP level, not just
    # denied by auth. redis has no `ports:` entry at all (confirmed above) -
    # it was never reachable from the host or internet either way, so binding
    # to loopback added no real security and just broke internal connectivity.
    # --bind 0.0.0.0 + requirepass (already set) is the correct combination:
    # reachable on the internal `db`/`backend` docker networks, authenticated,
    # still not published to the host.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0 --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 640m
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # server.js now drains in-flight requests on SIGTERM before exiting
    # (bounded by its own 9s internal force-exit timer) - give Docker a
    # grace period longer than that instead of the 10s default, so it
    # SIGKILLs only if the graceful path itself is stuck, not as the
    # normal outcome of every redeploy racing the default.
    stop_grace_period: 15s
    networks: [frontend, backend, db]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=200M
      - /app/logs:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLAMAV_HOST: clamav
      # Server-to-server auth for hermes calling /internal/* routes directly
      # (no user JWT exists in that context) - see internalMiddleware.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      PAPERCLIP_SERVICE: paperclip-transformer:8000
      HERMES_MODE: premium_multiagent
      # Load-bearing, not cosmetic: with APP_DOMAIN unset, CORS_ALLOWED_ORIGINS
      # ends up empty and server.js rejects every browser cross-origin
      # request outright (see its CORS_ALLOWED_ORIGINS warning at startup).
      # These were documented as fixed/forwarded in README.md but that fix
      # only ever landed in docker-compose.dokploy.yml, not this file - the
      # one Dokploy actually builds from. Fixed here so it's real.
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
    volumes:
      - recordings:/app/recordings
      # Read-only: lets src/migrate.js apply postgres/migrate-*.sql against
      # DATABASE_URL on every container start, before server.js begins
      # serving traffic (see command: below) - so a `git pull` + redeploy
      # picks up new migrations automatically instead of needing a manual
      # `docker exec ... psql` each time.
      - ./postgres:/app/postgres:ro
    # Overrides the Dockerfile's CMD to run the migration runner first;
    # migrate.js exits non-zero (crash-looping this container, visible in
    # `docker ps`/logs) if a migration fails, rather than starting the API
    # against a schema that didn't fully apply.
    command: ["sh", "-c", "node src/migrate.js && node src/server.js"]
    ports:
      - "127.0.0.1:8300:3000"  # was 3000 - collides with Dokploy's own dashboard on the host
      - "127.0.0.1:8301:3001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
  hermes-orchestrator:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # orchestrator.js finishes its current loop iteration on SIGTERM before
    # exiting (bounded by the two 1s BRPOP timeouts plus one runAgent()
    # call) - the default 10s grace period is already generous for that,
    # but bumped slightly so a slow runAgent() call (a real HTTP call to
    # api) doesn't get SIGKILLed mid-flight on a loaded host.
    stop_grace_period: 15s
    networks: [backend, db]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAPERCLIP_SERVICE: paperclip-transformer:8000
      API_INTERNAL_URL: http://api:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
  paperclip-transformer:
    build:
      context: ./paperclip
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=200M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - recordings:/app/recordings
      # persistent cache — this used to also be tmpfs-mounted at the same
      # path, which Docker Compose rejects (same bug already fixed in
      # docker-compose.dokploy.yml; this file just hadn't been updated to
      # match)
      - paperclip_cache:/app/cache
    # python:3.11-slim has no curl/wget by default, but does have python
    # itself, so use that to hit the real GET /health FastAPI already exposes.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768m
  # csv-handler service removed: csv-handler.js only defined/exported
  # functions, never started a server or consumer loop, so it crash-looped
  # in production. That logic already lives inline in POST
  # /leads/upload-csv in api/src/server.js - the csv-handler/ directory
  # itself has been deleted (see docker-compose.dokploy.yml for the same
  # note, and the README's production audit section).
  # transformer-worker service removed: it only ever consumed
  # `transformer:queue`, racing hermes-orchestrator's own (also removed)
  # consumer of the same Redis list for the same jobs - which container
  # actually handled a given upload was non-deterministic, and what it
  # called (Paperclip's old /transform) just fabricated a file path that
  # was never written. Real per-channel transformation now happens
  # synchronously inside POST /content/:assetId/transform (api/src/server.js
  # calls Paperclip directly and persists the real resized output) - nothing
  # pushes to `transformer:queue` any more, so there was nothing left for
  # this service to do. The transformer/ directory has been deleted (same
  # treatment as csv-handler/ above, for the same reason: a service left
  # running with nothing real to do).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks: [frontend]
    ports:
      - "127.0.0.1:8305:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
