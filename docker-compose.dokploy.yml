# OrgComms v4 - Dokploy Compose deployment
#
# In Dokploy: create the resource as type "Compose" (NOT "Application" — that
# path uses Nixpacks/single-app auto-detect and can't build this monorepo).
# Point it at this file, set the environment variables listed in
# .env.vps.example under the resource's Environment tab, then deploy.
#
# Exposing services to the internet: don't publish host ports here (removed
# below on purpose). Instead, in Dokploy go to this app's "Domains" tab and
# add a domain per service you want public, e.g.:
#   - service: frontend, container port: 80   -> app.yourdomain.com
#   - service: api,      container port: 3000 -> api.yourdomain.com
#   - service: api,      container port: 3001 -> (webhook path/subdomain, if needed)
# Dokploy's Traefik proxy joins the compose network and reaches each
# container directly over its internal port — publishing a fixed host port
# is unnecessary and risks colliding with other projects on the same VPS.
# postgres/redis/clamav/hermes/paperclip/csv-handler/transformer-worker stay
# internal-only; nothing else needs to reach them except sibling containers.

networks:
  frontend:
  backend:
    internal: true
  db:
    internal: true

volumes:
  pgdata:
  redisdata:
  recordings:
  clamav_data:
  paperclip_cache:

services:
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    networks: [backend]
    volumes:
      - clamav_data:/var/lib/clamav
    # No healthcheck override: this image ships its own (clamdcheck.sh,
    # 360s start_period to allow the first freshclam signature download) -
    # `depends_on: condition: service_healthy` below relies on it directly.

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks: [db]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orgcomms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orgcomms_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-secure.sql:/docker-entrypoint-initdb.d/init-secure.sql:ro
    # No ports: published — reachable internally as postgres:5432 only.
    # Need a one-off psql session? Use Dokploy's container terminal, or
    # `docker exec -it <postgres-container> psql -U orgcomms` on the host.
    # Neither the postgres nor redis official images ship a HEALTHCHECK -
    # without one, `depends_on` below only waits for the container to
    # start, not for Postgres to actually accept connections, so api could
    # start (and serve requests that hit the DB) during that gap.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [db]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=50M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0 --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # No REDIS_PASSWORD in `environment:` here (only baked into `command:`
    # above, compose-side) - so the healthcheck interpolates it the same
    # way `command:` does, at compose-parse time, rather than $$-escaping
    # for a container env var that doesn't exist.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [frontend, backend, db]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=200M
      - /app/logs:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLAMAV_HOST: clamav
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      PAPERCLIP_SERVICE: paperclip-transformer:8000
      HERMES_MODE: premium_multiagent
      # Both were listed in .env.vps.example but never actually forwarded into
      # this container - API_DOMAIN feeds webhook/integration URL building,
      # APP_DOMAIN is what CORS locks the API to. Set both in Dokploy's
      # Environment tab to your real domains (no scheme, e.g. app.example.com).
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      # Unset (or anything other than the literal string "false") = signup
      # stays open until the first account is created (see POST /auth/signup).
      # Set to "false" here once you've created your Super Admin, to close
      # the route outright rather than relying only on the one-time-use gate.
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
    volumes:
      - recordings:/app/recordings
    expose:
      - "3000"
      - "3001"
    # Give this service a domain in Dokploy's Domains tab (container port 3000,
    # and a second entry on 3001 if webhooks need their own host/path).

  hermes-orchestrator:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [backend, db]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAPERCLIP_SERVICE: paperclip-transformer:8000
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  paperclip-transformer:
    build:
      context: ./paperclip
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [backend]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=200M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - recordings:/app/recordings
      # persistent cache — was previously double-mounted with a tmpfs entry
      # at the same path, which Docker Compose rejects
      - paperclip_cache:/app/cache
    # python:3.11-slim has no curl/wget by default, but does have python
    # itself, so use that to hit the real GET /health FastAPI already exposes.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # csv-handler service removed: csv-handler/csv-handler.js only defines and
  # exports functions — it never opens a server or a Redis consumer loop, so
  # as a standalone container it logged one line and exited immediately,
  # which `restart: unless-stopped` then crash-looped forever. Its logic is
  # already fully duplicated inline in api/src/server.js's
  # POST /leads/upload-csv route, which is what actually runs today.
  # Reintroduce this service only once it's wired to a real queue/consumer.

  transformer-worker:
    build:
      context: ./transformer
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [backend]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAPERCLIP_SERVICE: paperclip-transformer:8000
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [frontend]
    expose:
      - "80"
    # Give this service a domain in Dokploy's Domains tab (container port 80).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
