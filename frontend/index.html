  <div id="root"></div>
  <script>(function(){
    // Runs before the app bundle so its initial tenant state can pick up a
    // real, previously-logged-in tenant instead of the hardcoded demo default,
    // and so the bundle's own API calls (leads upload, content upload, etc.)
    // have a token + API base to call with — the bundle otherwise has zero
    // knowledge of the session managed by the login gate below.
    try {
      var raw = localStorage.getItem('orgcomms_session');
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.tenant) window.__ORGCOMMS_TENANT__ = s.tenant;
        window.__ORGCOMMS_SESSION__ = s;
      }
    } catch (e) {}
  })();</script>

  <style>
    #oc-gate *{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
    #oc-gate{position:fixed;inset:0;z-index:99999;background:#0a0a0b;color:#fff;display:flex;align-items:center;justify-content:center}
    #oc-gate .oc-card{width:100%;max-width:380px;background:#141416;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px}
    #oc-gate .oc-logo{display:block;max-width:200px;width:100%;height:auto;margin:0 auto 16px;background:#fff;border-radius:12px;padding:10px}
    #oc-gate h1{font-size:18px;font-weight:700;margin:0 0 4px;text-align:center}
    #oc-gate p.oc-sub{font-size:12px;color:rgba(255,255,255,.5);margin:0 0 20px}
    #oc-gate label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.5);margin:14px 0 6px}
    #oc-gate input,#oc-gate select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font-size:13px;outline:none}
    #oc-gate input:focus,#oc-gate select:focus{border-color:#00a884}
    #oc-gate button.oc-primary{margin-top:20px;width:100%;padding:11px;border-radius:999px;border:none;background:#00a884;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
    #oc-gate button.oc-primary:disabled{opacity:.5;cursor:default}
    #oc-gate .oc-err{margin-top:12px;font-size:12px;color:#ff6b6b}
    #oc-gate .oc-switch{text-align:center;margin-top:16px;font-size:12px}
    #oc-gate .oc-switch a{color:#00a884;text-decoration:none;font-weight:600}
    #oc-gate .oc-switch a:hover{text-decoration:underline}
    #oc-bar{position:fixed;top:12px;right:12px;z-index:99998;display:flex;gap:8px;align-items:center;background:#141416;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 6px 6px 14px;font:12px Inter,system-ui,sans-serif;color:#fff}
    #oc-bar .oc-who{color:rgba(255,255,255,.6)}
    #oc-bar .oc-bar-icon{width:20px;height:20px;border-radius:5px;background:#fff;object-fit:contain;padding:1px}
    #oc-bar button{border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
    #oc-bar .oc-admin-btn{background:#00a884;color:#fff}
    #oc-bar .oc-logout-btn{background:rgba(255,255,255,.1);color:#fff}
    #oc-admin{position:fixed;inset:0;z-index:99997;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
    #oc-admin .oc-panel{width:100%;max-width:640px;background:#141416;color:#fff;border-radius:16px;border:1px solid rgba(255,255,255,.08);padding:24px}

    #oc-products .oc-close{position:absolute;top:16px;right:20px;background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer}

    #oc-products table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}

    #oc-products form label{grid-column:span 2;font-size:11px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:-4px}

    #oc-products .oc-full{grid-column:span 2}
    #oc-products .oc-submit{grid-column:span 2;padding:10px;border-radius:999px;border:none;background:#00a884;color:#fff;font-weight:600;cursor:pointer}
    #oc-products .oc-msg{font-size:12px;margin-top:8px}
    #oc-products .oc-msg.oc-ok{color:#00d19a}
    #oc-products .oc-msg.oc-bad{color:#ff6b6b}
    #oc-products .oc-back{background:none;border:none;color:#00a884;font-size:12px;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
    #oc-products .oc-pbtn{border:none;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
  </style>
  <script>
  (function(){
    var MANAGER_ROLES = ['SUPER_ADMIN','IT_ADMIN','DEPT_ADMIN'];
    var API_BASE = 'https://api.octaveaiautomation.com';
    var SESSION_KEY = 'orgcomms_session';

    function loadSession(){ try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ return null; } }
    function saveSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
    function clearSession(){ localStorage.removeItem(SESSION_KEY); }

    async function doFetch(session, path, opts){
      var isFormData = (typeof FormData !== 'undefined') && opts.body instanceof FormData;
      var headers = Object.assign({}, isFormData ? {} : {'Content-Type':'application/json'}, opts.headers||{});
      if (session && session.token) headers['Authorization'] = 'Bearer ' + session.token;
      var res = await fetch(session.apiBase.replace(/\/$/,'') + path, {
        method: opts.method || 'GET',
        headers: headers,
        body: isFormData ? opts.body : (opts.body ? JSON.stringify(opts.body) : undefined)
      });
      var data = null;
      try { data = await res.json(); } catch(e){}
      return { res: res, data: data };
    }

    async function api(session, path, opts){
      opts = opts || {};
      var first = await doFetch(session, path, opts);
      if (first.res.status === 401 && session.refresh) {
        try {
          var refreshRes = await fetch(session.apiBase.replace(/\/$/,'') + '/auth/refresh', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ refresh: session.refresh })
          });
          var refreshData = await refreshRes.json();
          if (refreshRes.ok && refreshData.token) {
            session.token = refreshData.token;
            localStorage.setItem('orgcomms_session', JSON.stringify(session));
            first = await doFetch(session, path, opts);
          } else {
            localStorage.removeItem('orgcomms_session');
            location.reload();
            throw new Error('Session expired, please sign in again');
          }
        } catch(e) {
          localStorage.removeItem('orgcomms_session');
          location.reload();
          throw e;
        }
      }
      if (!first.res.ok) throw new Error((first.data && first.data.error) || ('Request failed: ' + first.res.status));
      return first.data;
    }

    function renderLoginGate(){
      var existing = document.getElementById('oc-gate');
      if (existing) existing.remove();
      var root = document.getElementById('root');
      if (root) root.style.display = 'none';

      var gate = document.createElement('div');
      gate.id = 'oc-gate';
      document.body.appendChild(gate);

      function renderForm(mode, signupAvailable){
        var isSignup = mode === 'signup';
        gate.innerHTML =
          '<div class="oc-card">' +
            '<img src="/octave-logo.png" alt="Octave Growth Intelligence" class="oc-logo">' +
            '<h1>' + (isSignup ? 'Create Super Admin Account' : 'Sign In') + '</h1>' +
            '<p class="oc-sub">' + (isSignup ? 'One-time setup — this creates the first account and your tenant' : 'Sign in to your tenant') + '</p>' +
            '<form id="oc-auth-form">' +
              (isSignup ? '<label>Company Name</label><input id="oc-company" placeholder="Your company" required>' : '') +
              '<label>Email</label>' +
              '<input id="oc-email" type="email" required>' +
              '<label>Password</label>' +
              '<input id="oc-password" type="password" minlength="12" required>' +
              (isSignup ? '<label>Confirm Password</label><input id="oc-password-confirm" type="password" minlength="12" required>' : '') +
              (!isSignup ? '<div id="oc-totp-wrap" style="display:none"><label>2FA Code</label><input id="oc-totp"></div>' : '') +
              '<button class="oc-primary" type="submit">' + (isSignup ? 'Create Account' : 'Sign In') + '</button>' +
              '<div class="oc-err" id="oc-err" style="display:none"></div>' +
            '</form>' +
            (signupAvailable ? '<p class="oc-switch"><a href="#" id="oc-switch-link">' + (isSignup ? 'Already have an account? Sign in' : 'First time here? Create the Super Admin account') + '</a></p>' : '') +
          '</div>';

        if (signupAvailable) {
          document.getElementById('oc-switch-link').addEventListener('click', function(ev){
            ev.preventDefault();
            renderForm(isSignup ? 'login' : 'signup', signupAvailable);
          });
        }

        document.getElementById('oc-auth-form').addEventListener('submit', async function(ev){
          ev.preventDefault();
          var apiBase = API_BASE;
          var email = document.getElementById('oc-email').value.trim();
          var password = document.getElementById('oc-password').value;
          var errEl = document.getElementById('oc-err');
          errEl.style.display = 'none';
          var btn = ev.target.querySelector('button');
          btn.disabled = true;
          try {
            var endpoint, body;
            if (isSignup) {
              var confirmPassword = document.getElementById('oc-password-confirm').value;
              if (password !== confirmPassword) throw new Error('Passwords do not match');
              endpoint = '/auth/signup';
              body = { email: email, password: password, company_name: document.getElementById('oc-company').value.trim() };
            } else {
              var totp = document.getElementById('oc-totp').value.trim();
              endpoint = '/auth/login';
              body = { email: email, password: password };
              if (totp) body.totp = totp;
            }
            var authRes = await fetch(apiBase.replace(/\/$/,'') + endpoint, {
              method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
            });
            var authData = await authRes.json();
            if (!authRes.ok) {
              if (!isSignup && authData && authData.need_2fa) {
                document.getElementById('oc-totp-wrap').style.display = 'block';
                throw new Error('Enter your 2FA code and sign in again');
              }
              throw new Error((authData && authData.error) || (isSignup ? 'Signup failed' : 'Login failed'));
            }
            var session = { apiBase: apiBase, token: authData.token, refresh: authData.refresh, user: authData.user, tenant: null };
            var tenantRes = await fetch(apiBase.replace(/\/$/,'') + '/tenants/me', { headers: { Authorization: 'Bearer ' + authData.token } });
            if (tenantRes.ok) session.tenant = await tenantRes.json();
            saveSession(session);
            location.reload();
          } catch(e){
            errEl.textContent = e.message;
            errEl.style.display = 'block';
            btn.disabled = false;
          }
        });
      }

      renderForm('login', false);
      fetch(API_BASE.replace(/\/$/,'') + '/auth/signup-status')
        .then(function(r){ return r.ok ? r.json() : { available: false }; })
        .then(function(status){ if (status.available) renderForm('login', true); })
        .catch(function(){});
    }

    function renderBar(session){
      var existing = document.getElementById('oc-bar');
      if (existing) existing.remove();
      var root = document.getElementById('root');
      if (root) root.style.display = '';

      var bar = document.createElement('div');
      bar.id = 'oc-bar';
      var canManageUsers = MANAGER_ROLES.indexOf(session.user.role) !== -1;
      bar.innerHTML =
        '<img src="/octave-icon.png" alt="Octave" class="oc-bar-icon">' +
        '<span class="oc-who">' + session.user.email + ' &middot; ' + session.user.role + (session.tenant ? ' &middot; ' + session.tenant.name : '') + '</span>' +
        '<button class="oc-logout-btn" id="oc-open-products">Products</button>' +
        '<button class="oc-logout-btn" id="oc-open-security">Security</button>' +
        (canManageUsers ? '<button class="oc-admin-btn" id="oc-open-admin">Admin</button>' : '') +
        '<button class="oc-logout-btn" id="oc-logout">Logout</button>';
      document.body.appendChild(bar);

      document.getElementById('oc-logout').addEventListener('click', function(){
        clearSession();
        location.reload();
      });
      if (canManageUsers) {
        document.getElementById('oc-open-admin').addEventListener('click', function(){ renderAdmin(session); });
      }
      document.getElementById('oc-open-security').addEventListener('click', function(){ renderSecurity(session); });
      document.getElementById('oc-open-products').addEventListener('click', function(){ renderProducts(session); });
    }

    function renderSecurity(session){
      var existing = document.getElementById('oc-security');
      if (existing) existing.remove();
      var wrap = document.createElement('div');
      wrap.id = 'oc-security';
      wrap.className = 'oc-admin-overlay';
      wrap.innerHTML =
        '<div class="oc-panel" style="max-width:400px">' +
          '<button class="oc-close" id="oc-security-close">&times;</button>' +
          '<h2 style="margin:0 0 16px">Two-Factor Authentication</h2>' +
          '<div id="oc-2fa-body">Loading&hellip;</div>' +
        '</div>';
      document.body.appendChild(wrap);
      document.getElementById('oc-security-close').addEventListener('click', function(){ wrap.remove(); });

      async function loadStatus(){
        var body = document.getElementById('oc-2fa-body');
        try {
          var status = await api(session, '/auth/2fa/status');
          if (status.enabled) {
            body.innerHTML =
              '<p style="font-size:13px">2FA is <strong style="color:#00d19a">enabled</strong> on your account.</p>' +
              '<label>Current Password</label><input id="oc-2fa-password" type="password">' +
              '<button class="oc-submit" id="oc-2fa-disable" style="margin-top:10px">Disable 2FA</button>' +
              '<div class="oc-msg" id="oc-2fa-msg"></div>';
            document.getElementById('oc-2fa-disable').addEventListener('click', async function(){
              var msg = document.getElementById('oc-2fa-msg');
              try {
                await api(session, '/auth/2fa/disable', { method: 'POST', body: { password: document.getElementById('oc-2fa-password').value } });
                loadStatus();
              } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
            });
          } else {
            body.innerHTML =
              '<p style="font-size:13px">2FA is <strong style="color:rgba(255,255,255,.6)">disabled</strong>.</p>' +
              '<button class="oc-submit" id="oc-2fa-start">Enable 2FA</button>' +
              '<div id="oc-2fa-setup" style="display:none;margin-top:12px">' +
                '<p style="font-size:12px;color:rgba(255,255,255,.6)">Scan with your authenticator app:</p>' +
                '<img id="oc-2fa-qr" style="display:block;margin:8px auto;border-radius:8px" width="180" height="180">' +
                '<p style="font-size:11px;color:rgba(255,255,255,.5);word-break:break-all" id="oc-2fa-secret"></p>' +
                '<label>Enter the 6-digit code to confirm</label>' +
                '<input id="oc-2fa-code" maxlength="6">' +
                '<button class="oc-submit" id="oc-2fa-confirm" style="margin-top:10px">Verify &amp; Enable</button>' +
              '</div>' +
              '<div class="oc-msg" id="oc-2fa-msg"></div>';
            document.getElementById('oc-2fa-start').addEventListener('click', async function(){
              var msg = document.getElementById('oc-2fa-msg');
              try {
                var setup = await api(session, '/auth/2fa/setup', { method: 'POST' });
                document.getElementById('oc-2fa-qr').src = setup.qr;
                document.getElementById('oc-2fa-secret').textContent = 'Manual entry key: ' + setup.secret;
                document.getElementById('oc-2fa-setup').style.display = 'block';
              } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
            });
            document.getElementById('oc-2fa-confirm').addEventListener('click', async function(){
              var msg = document.getElementById('oc-2fa-msg');
              try {
                await api(session, '/auth/2fa/verify', { method: 'POST', body: { token: document.getElementById('oc-2fa-code').value } });
                loadStatus();
              } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
            });
          }
        } catch(e){ body.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '</div>'; }
      }
      loadStatus();
    }

    function renderProducts(session){
      var existing = document.getElementById('oc-products');
      if (existing) existing.remove();
      var isTenantAdmin = MANAGER_ROLES.indexOf(session.user.role) !== -1;
      var wrap = document.createElement('div');
      wrap.id = 'oc-products';
      wrap.innerHTML =
        '<div class="oc-panel">' +
          '<button class="oc-close" id="oc-products-close">&times;</button>' +
          '<h2>Products &amp; Services</h2>' +
          '<div id="oc-products-body">Loading&hellip;</div>' +
        '</div>';
      document.body.appendChild(wrap);
      document.getElementById('oc-products-close').addEventListener('click', function(){ wrap.remove(); });

      async function loadList(){
        var body = document.getElementById('oc-products-body');
        body.innerHTML = 'Loading&hellip;';
        try {
          var products = await api(session, '/products');
          var rows = products.map(function(p){
            return '<tr><td>' + p.name + '</td><td>' + (p.description || '') + '</td><td><button class="oc-pbtn" data-id="' + p.id + '" data-name="' + String(p.name).replace(/"/g,'&quot;') + '">Manage</button></td></tr>';
          }).join('');
          body.innerHTML =
            '<h2>Products &amp; Services</h2>' +
            '<table><tr><th>Name</th><th>Description</th><th></th></tr>' + (rows || '<tr><td colspan="3" style="color:rgba(255,255,255,.5)">No products yet</td></tr>') + '</table>' +
            (isTenantAdmin ?
              '<form id="oc-create-product">' +
                '<label class="oc-full">Create Product/Service</label>' +
                '<input name="name" placeholder="Name" required class="oc-full">' +
                '<input name="description" placeholder="Description (optional)" class="oc-full">' +
                '<button class="oc-submit" type="submit">Create</button>' +
                '<div class="oc-msg oc-full" id="oc-product-msg"></div>' +
              '</form>' : '');

          body.querySelectorAll('.oc-pbtn').forEach(function(btn){
            btn.addEventListener('click', function(){ loadDetail(btn.dataset.id, btn.dataset.name); });
          });
          var form = document.getElementById('oc-create-product');
          if (form) form.addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-product-msg');
            var fd = new FormData(ev.target);
            try {
              await api(session, '/products', { method: 'POST', body: { name: fd.get('name'), description: fd.get('description') } });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Created.';
              loadList();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){ body.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '</div>'; }
      }

      async function loadDetail(productId, productName){
        var body = document.getElementById('oc-products-body');
        body.innerHTML =
          '<button class="oc-back" id="oc-back-to-list">&larr; Back to Products</button>' +
          '<h2 style="font-size:14px">' + productName + '</h2>' +
          '<div class="oc-tabs">' +
            '<button class="oc-tab oc-active" data-tab="members">Members</button>' +
            '<button class="oc-tab" data-tab="channels">Channels</button>' +
            '<button class="oc-tab" data-tab="agents">Agents</button>' +
          '</div>' +
          '<div id="oc-ptab-members"></div>' +
          '<div id="oc-ptab-channels" style="display:none"></div>' +
          '<div id="oc-ptab-agents" style="display:none"></div>';

        document.getElementById('oc-back-to-list').addEventListener('click', loadList);
        body.querySelectorAll('.oc-tab').forEach(function(tab){
          tab.addEventListener('click', function(){
            body.querySelectorAll('.oc-tab').forEach(function(t){ t.classList.remove('oc-active'); });
            tab.classList.add('oc-active');
            document.getElementById('oc-ptab-members').style.display = tab.dataset.tab === 'members' ? 'block' : 'none';
            document.getElementById('oc-ptab-channels').style.display = tab.dataset.tab === 'channels' ? 'block' : 'none';
            document.getElementById('oc-ptab-agents').style.display = tab.dataset.tab === 'agents' ? 'block' : 'none';
            if (tab.dataset.tab === 'channels') loadChannels();
            if (tab.dataset.tab === 'agents') loadProductAgents();
          });
        });

        async function loadMembers(){
          var el = document.getElementById('oc-ptab-members');
          el.innerHTML = 'Loading&hellip;';
          try {
            var members = await api(session, '/products/' + productId + '/members');
            var canAdmin = isTenantAdmin || members.some(function(m){ return m.user_id === session.user.id && m.role === 'ADMIN'; });
            var rows = members.map(function(m){
              return '<tr><td>' + m.email + '</td><td>' + m.role + '</td><td>' + (canAdmin ? '<button class="oc-pbtn" data-uid="' + m.user_id + '">Remove</button>' : '') + '</td></tr>';
            }).join('');

            var pickerHtml = '<input name="user_id" placeholder="User ID" class="oc-full" required>';
            var tenantUsers = null;
            if (canAdmin && isTenantAdmin) {
              try { tenantUsers = await api(session, '/users'); } catch(e) { tenantUsers = null; }
            }
            if (tenantUsers) {
              pickerHtml = '<select name="user_id" class="oc-full">' + tenantUsers.map(function(u){ return '<option value="' + u.id + '">' + u.email + ' (' + u.role + ')</option>'; }).join('') + '</select>';
            }

            el.innerHTML =
              '<table><tr><th>User</th><th>Role</th><th></th></tr>' + (rows || '<tr><td colspan="3" style="color:rgba(255,255,255,.5)">No members yet</td></tr>') + '</table>' +
              (canAdmin ?
                '<form id="oc-add-member">' +
                  '<label class="oc-full">Add Member</label>' +
                  pickerHtml +
                  '<select name="role"><option value="MEMBER">Member</option><option value="ADMIN">Product Admin</option></select>' +
                  '<button class="oc-submit" type="submit">Add</button>' +
                  '<div class="oc-msg oc-full" id="oc-member-msg"></div>' +
                '</form>' : '');

            el.querySelectorAll('.oc-pbtn').forEach(function(btn){
              btn.addEventListener('click', async function(){
                try { await api(session, '/products/' + productId + '/members/' + btn.dataset.uid, { method: 'DELETE' }); loadMembers(); }
                catch(e){ alert(e.message); }
              });
            });
            var form = document.getElementById('oc-add-member');
            if (form) form.addEventListener('submit', async function(ev){
              ev.preventDefault();
              var msg = document.getElementById('oc-member-msg');
              var fd = new FormData(ev.target);
              try {
                await api(session, '/products/' + productId + '/members', { method: 'POST', body: { user_id: fd.get('user_id'), role: fd.get('role') } });
                msg.className = 'oc-msg oc-ok'; msg.textContent = 'Added.';
                loadMembers();
              } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
            });
          } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '</div>'; }
        }

        async function loadChannels(){
          var el = document.getElementById('oc-ptab-channels');
          el.innerHTML = 'Loading&hellip;';
          try {
            var channels = await api(session, '/products/' + productId + '/channels');
            var configured = {};
            channels.forEach(function(c){ configured[c.channel] = c.status; });
            var all = ['whatsapp','facebook','instagram','linkedin','youtube','quora','email'];
            var rows = all.map(function(ch){ return '<tr><td>' + ch + '</td><td>' + (configured[ch] || 'not_configured') + '</td></tr>'; }).join('');
            el.innerHTML =
              '<table><tr><th>Channel</th><th>Status</th></tr>' + rows + '</table>' +
              '<form id="oc-config-channel">' +
                '<label class="oc-full">Configure a Channel</label>' +
                '<select name="channel">' + all.map(function(ch){ return '<option value="' + ch + '">' + ch + '</option>'; }).join('') + '</select>' +
                '<input name="note" placeholder="Note (no real platform integration yet)" class="oc-full">' +
                '<button class="oc-submit" type="submit">Save</button>' +
                '<div class="oc-msg oc-full" id="oc-channel-msg"></div>' +
              '</form>';
            document.getElementById('oc-config-channel').addEventListener('submit', async function(ev){
              ev.preventDefault();
              var msg = document.getElementById('oc-channel-msg');
              var fd = new FormData(ev.target);
              try {
                await api(session, '/products/' + productId + '/channels', { method: 'POST', body: { channel: fd.get('channel'), config: { note: fd.get('note') } } });
                msg.className = 'oc-msg oc-ok'; msg.textContent = 'Saved.';
                loadChannels();
              } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
            });
          } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '</div>'; }
        }

        async function loadProductAgents(){
          var el = document.getElementById('oc-ptab-agents');
          el.innerHTML = 'Loading&hellip;';
          try {
            var enabled = await api(session, '/products/' + productId + '/agents');
            var available = await api(session, '/agents');
            var rows = enabled.map(function(a){
              return '<tr><td>' + a.name + '</td><td>' + (a.model || '&mdash;') + '</td><td><button class="oc-pbtn" data-id="' + a.id + '">Disable</button></td></tr>';
            }).join('');
            el.innerHTML =
              '<table><tr><th>Agent</th><th>Model</th><th></th></tr>' + (rows || '<tr><td colspan="3" style="color:rgba(255,255,255,.5)">No agents enabled — Premium plan only</td></tr>') + '</table>' +
              (available.length ?
                '<form id="oc-enable-agent">' +
                  '<label class="oc-full">Enable an Agent</label>' +
                  '<select name="agent_id" class="oc-full">' + available.map(function(a){ return '<option value="' + a.id + '">' + a.name + '</option>'; }).join('') + '</select>' +
                  '<button class="oc-submit" type="submit">Enable</button>' +
                  '<div class="oc-msg oc-full" id="oc-pagent-msg"></div>' +
                '</form>'
              : '<div class="oc-msg">No agents have been created yet — a Super Admin creates these under Admin &rarr; Agents.</div>');

            el.querySelectorAll('.oc-pbtn').forEach(function(btn){
              btn.addEventListener('click', async function(){
                try { await api(session, '/products/' + productId + '/agents/' + btn.dataset.id, { method: 'DELETE' }); loadProductAgents(); }
                catch(e){ alert(e.message); }
              });
            });
            var form = document.getElementById('oc-enable-agent');
            if (form) form.addEventListener('submit', async function(ev){
              ev.preventDefault();
              var msg = document.getElementById('oc-pagent-msg');
              var fd = new FormData(ev.target);
              try {
                await api(session, '/products/' + productId + '/agents', { method: 'POST', body: { agent_id: fd.get('agent_id') } });
                msg.className = 'oc-msg oc-ok'; msg.textContent = 'Enabled.';
                loadProductAgents();
              } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
            });
          } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '</div>'; }
        }

        loadMembers();
      }

      loadList();
    }

    function renderAdmin(session){
      var existing = document.getElementById('oc-admin');
      if (existing) existing.remove();
      var isSuperAdmin = session.user.role === 'SUPER_ADMIN';
      var canSeeWebhooks = isSuperAdmin || session.user.role === 'IT_ADMIN';
      var wrap = document.createElement('div');
      wrap.id = 'oc-admin';
      wrap.innerHTML =
        '<div class="oc-panel">' +
          '<button class="oc-close" id="oc-admin-close">&times;</button>' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><img src="/octave-icon.png" alt="Octave" style="width:24px;height:24px;border-radius:6px;background:#fff;object-fit:contain;padding:1px"><h2 style="margin:0">Tenant &amp; User Administration</h2></div>' +
          '<div class="oc-tabs">' +
            (isSuperAdmin ? '<button class="oc-tab oc-active" data-tab="tenants">Tenants</button>' : '') +
            '<button class="oc-tab' + (isSuperAdmin ? '' : ' oc-active') + '" data-tab="users">Users</button>' +
            (canSeeWebhooks ? '<button class="oc-tab" data-tab="webhooks">Webhooks</button>' : '') +
            (isSuperAdmin ? '<button class="oc-tab" data-tab="agents">Agents</button>' : '') +
          '</div>' +
          '<div id="oc-tab-tenants" style="display:' + (isSuperAdmin ? 'block' : 'none') + '"></div>' +
          '<div id="oc-tab-users" style="display:' + (isSuperAdmin ? 'none' : 'block') + '"></div>' +
          '<div id="oc-tab-webhooks" style="display:none"></div>' +
          '<div id="oc-tab-agents" style="display:none"></div>' +
        '</div>';
      document.body.appendChild(wrap);
      document.getElementById('oc-admin-close').addEventListener('click', function(){ wrap.remove(); });

      wrap.querySelectorAll('.oc-tab').forEach(function(tab){
        tab.addEventListener('click', function(){
          wrap.querySelectorAll('.oc-tab').forEach(function(t){ t.classList.remove('oc-active'); });
          tab.classList.add('oc-active');
          document.getElementById('oc-tab-tenants').style.display = tab.dataset.tab === 'tenants' ? 'block' : 'none';
          document.getElementById('oc-tab-users').style.display = tab.dataset.tab === 'users' ? 'block' : 'none';
          document.getElementById('oc-tab-webhooks').style.display = tab.dataset.tab === 'webhooks' ? 'block' : 'none';
          document.getElementById('oc-tab-agents').style.display = tab.dataset.tab === 'agents' ? 'block' : 'none';
          if (tab.dataset.tab === 'agents' && isSuperAdmin) loadAgentsTab();
        });
      });

      var selectedTenantId = session.user.tenant_id;

      async function loadTenants(){
        var el = document.getElementById('oc-tab-tenants');
        el.innerHTML = 'Loading&hellip;';
        try {
          var tenants = await api(session, '/tenants');
          var rows = tenants.map(function(t){
            return '<tr><td>' + t.name + '</td><td>' + t.subdomain + '</td><td>' + t.plan + '</td>' +
              '<td><button class="oc-pick-tenant" data-id="' + t.id + '" data-name="' + t.name + '">Manage users</button></td></tr>';
          }).join('');
          el.innerHTML =
            '<table><tr><th>Name</th><th>Subdomain</th><th>Plan</th><th></th></tr>' + rows + '</table>' +
            '<form id="oc-create-tenant">' +
              '<label class="oc-full">Create Tenant</label>' +
              '<input name="name" placeholder="Tenant name" required>' +
              '<input name="subdomain" placeholder="subdomain" required>' +
              '<select name="plan"><option value="starter">Starter</option><option value="premium">Premium</option></select>' +
              '<button class="oc-submit" type="submit">Create</button>' +
              '<div class="oc-msg oc-full" id="oc-tenant-msg"></div>' +
            '</form>';
          el.querySelectorAll('.oc-pick-tenant').forEach(function(btn){
            btn.addEventListener('click', function(){
              selectedTenantId = btn.dataset.id;
              wrap.querySelector('[data-tab="users"]').click();
              loadUsers();
            });
          });
          el.querySelector('#oc-create-tenant').addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-tenant-msg');
            var fd = new FormData(ev.target);
            try {
              await api(session, '/tenants', { method: 'POST', body: { name: fd.get('name'), subdomain: fd.get('subdomain'), plan: fd.get('plan') } });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Tenant created.';
              loadTenants();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '</div>'; }
      }

      async function loadUsers(){
        var el = document.getElementById('oc-tab-users');
        el.innerHTML = 'Loading&hellip;';
        try {
          var roles = await api(session, '/roles');
          var qs = (isSuperAdmin && selectedTenantId) ? ('?tenant_id=' + encodeURIComponent(selectedTenantId)) : '';
          var users = await api(session, '/users' + qs);
          var roleOptions = roles.map(function(r){ return '<option value="' + r.name + '">' + r.name + '</option>'; }).join('');
          var rows = users.map(function(u){
            return '<tr><td>' + u.email + '</td><td>' +
              '<select class="oc-role-select" data-id="' + u.id + '">' +
                roles.map(function(r){ return '<option value="' + r.name + '"' + (r.name===u.role?' selected':'') + '>' + r.name + '</option>'; }).join('') +
              '</select></td><td><button class="oc-save-role" data-id="' + u.id + '">Save</button></td></tr>';
          }).join('');
          el.innerHTML =
            (isSuperAdmin ? '<div class="oc-msg" style="margin-bottom:8px">Managing tenant: ' + (selectedTenantId || session.user.tenant_id) + '</div>' : '') +
            '<table><tr><th>Email</th><th>Role</th><th></th></tr>' + rows + '</table>' +
            '<form id="oc-create-user">' +
              '<label class="oc-full">Create User</label>' +
              '<input name="email" type="email" placeholder="email" required>' +
              '<input name="password" type="password" placeholder="password (min 12 chars)" required minlength="12">' +
              '<select name="role" class="oc-full">' + roleOptions + '</select>' +
              '<button class="oc-submit" type="submit">Create</button>' +
              '<div class="oc-msg oc-full" id="oc-user-msg"></div>' +
            '</form>';
          el.querySelectorAll('.oc-save-role').forEach(function(btn){
            btn.addEventListener('click', async function(){
              var sel = el.querySelector('.oc-role-select[data-id="' + btn.dataset.id + '"]');
              try {
                await api(session, '/users/' + btn.dataset.id + '/role', { method: 'PATCH', body: { role: sel.value } });
                btn.textContent = 'Saved';
                setTimeout(function(){ btn.textContent = 'Save'; }, 1500);
              } catch(e){ alert(e.message); }
            });
          });
          el.querySelector('#oc-create-user').addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-user-msg');
            var fd = new FormData(ev.target);
            var payload = { email: fd.get('email'), password: fd.get('password'), role: fd.get('role') };
            if (isSuperAdmin && selectedTenantId) payload.tenant_id = selectedTenantId;
            try {
              await api(session, '/users', { method: 'POST', body: payload });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'User created.';
              loadUsers();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '</div>'; }
      }

      async function loadWebhooks(){
        var el = document.getElementById('oc-tab-webhooks');
        el.innerHTML = 'Loading&hellip;';
        try {
          var data = await api(session, '/integrations/webhook-urls');
          var rows = data.urls.map(function(u){
            return '<tr><td>' + u.channel + '</td><td><input readonly value="' + u.url.replace(/"/g,'&quot;') + '" style="width:100%;font-size:11px" onclick="this.select()"></td></tr>';
          }).join('');
          el.innerHTML =
            '<table><tr><th>Channel</th><th>Webhook URL</th></tr>' + rows + '</table>' +
            '<button class="oc-submit" id="oc-rotate-secret" style="max-width:220px">Rotate Secret</button>' +
            '<div class="oc-msg" id="oc-webhook-msg"></div>';
          el.querySelector('#oc-rotate-secret').addEventListener('click', async function(){
            if (!confirm('Rotating invalidates every URL above — every configured channel will need the new URL. Continue?')) return;
            var msg = document.getElementById('oc-webhook-msg');
            try {
              await api(session, '/integrations/webhook-secret/rotate', { method: 'POST' });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Rotated. URLs below are updated.';
              loadWebhooks();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){
          el.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '<br>No secret yet? Rotate once to provision one.</div>' +
            '<button class="oc-submit" id="oc-rotate-secret" style="max-width:220px">Rotate Secret</button>';
          el.querySelector('#oc-rotate-secret').addEventListener('click', async function(){
            try { await api(session, '/integrations/webhook-secret/rotate', { method: 'POST' }); loadWebhooks(); } catch(e2){ alert(e2.message); }
          });
        }
      }

      async function loadAgentsTab(){
        var el = document.getElementById('oc-tab-agents');
        el.innerHTML = 'Loading&hellip;';
        try {
          var connections = await api(session, '/llm-connections');
          var agents = await api(session, '/agents');
          var connOptions = connections.map(function(c){ return '<option value="' + c.id + '">' + c.name + ' (' + c.provider + ')</option>'; }).join('');
          el.innerHTML =
            '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.5);margin:0 0 8px">LLM Connections</h4>' +
            '<table><tr><th>Name</th><th>Provider</th></tr>' + connections.map(function(c){ return '<tr><td>' + c.name + '</td><td>' + c.provider + '</td></tr>'; }).join('') + '</table>' +
            '<form id="oc-create-connection">' +
              '<label class="oc-full">Add LLM Connection</label>' +
              '<input name="name" placeholder="Connection name" required>' +
              '<select name="provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option></select>' +
              '<input name="api_key" type="password" placeholder="API key" class="oc-full" required>' +
              '<button class="oc-submit" type="submit">Add</button>' +
              '<div class="oc-msg" id="oc-connection-msg"></div>' +
            '</form>' +
            '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.5);margin:20px 0 8px">Agents</h4>' +
            '<table><tr><th>Name</th><th>Model</th><th>Active</th></tr>' + agents.map(function(a){ return '<tr><td>' + a.name + '</td><td>' + (a.model || '—') + '</td><td>' + (a.active ? 'Yes' : 'No') + '</td></tr>'; }).join('') + '</table>' +
            (connections.length ?
              '<form id="oc-create-agent">' +
                '<label class="oc-full">Create Agent</label>' +
                '<input name="name" placeholder="Agent name" required>' +
                '<select name="llm_connection_id" class="oc-full">' + connOptions + '</select>' +
                '<input name="model" placeholder="Model (e.g. claude-sonnet-5)" class="oc-full">' +
                '<textarea name="system_prompt" placeholder="System prompt" class="oc-full" style="grid-column:span 2;min-height:60px;padding:9px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font-size:13px;font-family:inherit"></textarea>' +
                '<button class="oc-submit" type="submit">Create</button>' +
                '<div class="oc-msg" id="oc-agent-msg"></div>' +
              '</form>'
            : '<div class="oc-msg" style="margin-top:8px">Add an LLM connection first before creating an agent.</div>');

          var connForm = document.getElementById('oc-create-connection');
          if (connForm) connForm.addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-connection-msg');
            var fd = new FormData(ev.target);
            try {
              await api(session, '/llm-connections', { method: 'POST', body: { name: fd.get('name'), provider: fd.get('provider'), api_key: fd.get('api_key') } });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Connection added.';
              loadAgentsTab();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
          var agentForm = document.getElementById('oc-create-agent');
          if (agentForm) agentForm.addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-agent-msg');
            var fd = new FormData(ev.target);
            try {
              await api(session, '/agents', { method: 'POST', body: { name: fd.get('name'), llm_connection_id: fd.get('llm_connection_id'), model: fd.get('model'), system_prompt: fd.get('system_prompt') } });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Agent created.';
              loadAgentsTab();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + e.message + '</div>'; }
      }

      if (isSuperAdmin) loadTenants();
      loadUsers();
      if (canSeeWebhooks) loadWebhooks();
    }

    function boot(){
      var session = loadSession();
      if (!session || !session.token) {
        renderLoginGate();
      } else {
        renderBar(session);
      }
    }

    // Exposed so the main app bundle's own event handlers (leads upload,
    // content upload, etc.) can make authenticated calls — same 401-refresh
    // retry logic as everything in this script, not a separate code path.
    window.__ORGCOMMS_API__ = function(path, opts){
      var session = loadSession();
      if (!session) { return Promise.reject(new Error('Not signed in')); }
      return api(session, path, opts);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
