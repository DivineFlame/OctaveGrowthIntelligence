limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Host-side ports moved to 8300/8301 - 3000 collides with Dokploy's own
# dashboard when both run on the same VPS (see docker-compose.vps.yml).
upstream api_backend { server 127.0.0.1:8300; }
upstream webhook_backend { server 127.0.0.1:8301; }
server { listen 80; server_name api.yourdomain.com app.yourdomain.com; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 301 https://$host$request_uri; } }
server {
    listen 443 ssl http2; server_name api.yourdomain.com;
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 110M;
    location /auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api_backend; }
    location /leads/upload-csv { limit_req zone=upload burst=10 nodelay; client_max_body_size 11M; proxy_pass http://api_backend; }
    location /content/upload { limit_req zone=upload burst=5 nodelay; client_max_body_size 101M; proxy_pass http://api_backend; }
    location /webhooks/ { limit_req zone=webhook burst=40 nodelay; proxy_pass http://webhook_backend; }
    # /metrics exposes request-volume/latency counts (see api/src/metrics.js)
    # and is meant for a scraper joined to the same Docker network, not the
    # public internet - a route-hit fingerprint is a minor leak on its own,
    # but there's no reason to accept it. Scrape it with
    # `docker exec <api container> wget -qO- http://localhost:3000/metrics`
    # or from a Prometheus container on the same compose network instead.
    location = /metrics { deny all; return 403; }
    location / { limit_req zone=api burst=100 nodelay; proxy_pass http://api_backend; }
}
server {
    listen 443 ssl http2; server_name app.yourdomain.com;
    ssl_certificate /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # frontend/index.html now has 3 inline <script> blocks (the session/
    # theme bootstrap, the external-link handler, and the overlay app -
    # see frontend/app/scripts/assemble.js) plus the built React app, which
    # is loaded as an external same-origin <script src> and needs no hash
    # (script-src 'self' already covers it). script-src still drops
    # 'unsafe-inline' in favor of exact sha256 hashes of each inline
    # block's content - this is what actually makes CSP a real second line
    # of defense against the XSS class fixed in frontend/overlay.html (see
    # README "Hardening notes"), rather than a header that quietly allows
    # any injected inline <script> to run anyway.
    # IMPORTANT: whenever an inline <script> block's content changes
    # (overlay.html, or the two small bootstrap scripts in assemble.js),
    # regenerate these hashes with scripts/gen-csp-hashes.sh (run it after
    # `npm run build` in frontend/app, against the built frontend/index.html)
    # and update this header, or the page will fail to load (browser
    # console will show a CSP violation naming the offending script).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-6/gjyOg13o2y2SGWdj/cKrpL8RQFpBBw+dk70MqM30U=' 'sha256-IYGaQP9wMmALOyndgDkiUCNJzPDxTqdr9AlHsKQMdfM=' 'sha256-Ih8fn0PCu++1PnB3tDAlMdINua2Udv0uPZfEkZW+Xdk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.octaveaiautomation.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
    root /var/www/orgcomms/app; index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
