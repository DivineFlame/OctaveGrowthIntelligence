  <script>
  (function(){
    var MANAGER_ROLES = ['SUPER_ADMIN','IT_ADMIN','DEPT_ADMIN'];
    var API_BASE = 'https://api.octaveaiautomation.com';
    var SESSION_KEY = 'orgcomms_session';

    function loadSession(){ try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ return null; } }
    function saveSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }

    // HTML-escapes a value before it's spliced into an innerHTML template
    // string. Most of the strings rendered this way are attacker-reachable
    // stored data (a product name, an uploaded file's original filename, a
    // tenant/company name from signup, a member's email) - none of that was
    // being escaped anywhere in this file, so a product named
    // `<img src=x onerror=alert(document.cookie)>` would execute for every
    // admin who opened Products. Used everywhere a stored/user-supplied
    // field (not a fixed, code-defined string) is interpolated into markup.
    var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ESC_MAP[c]; }); }

    // Light/dark theme - applied via a data-theme attribute on <html> so the
    // CSS custom properties defined in the <style> block above can switch
    // per-theme. A tiny inline script at the very top of <body> mirrors this
    // read (before this bundle even parses) so the page never flashes the
    // wrong theme on first paint.
    var THEME_KEY = 'octave_theme';
    function getTheme(){ try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch(e){ return 'dark'; } }
    function setTheme(t){
      try { localStorage.setItem(THEME_KEY, t); } catch(e){}
      document.documentElement.setAttribute('data-theme', t);
    }

    async function doFetch(session, path, opts){
      var isFormData = (typeof FormData !== 'undefined') && opts.body instanceof FormData;
      var headers = Object.assign({}, isFormData ? {} : {'Content-Type':'application/json'}, opts.headers||{});
      if (session && session.token) headers['Authorization'] = 'Bearer ' + session.token;
      var res = await fetch(session.apiBase.replace(/\/$/,'') + path, {
        method: opts.method || 'GET',
        headers: headers,
        body: isFormData ? opts.body : (opts.body ? JSON.stringify(opts.body) : undefined)
      });
      var data = null;
      try { data = await res.json(); } catch(e){}
      return { res: res, data: data };
    }

      opts = opts || {};
      var first = await doFetch(session, path, opts);
      if (first.res.status === 401 && session.refresh) {
        try {
          var refreshRes = await fetch(session.apiBase.replace(/\/$/,'') + '/auth/refresh', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ refresh: session.refresh })
          });
          var refreshData = await refreshRes.json();
          if (refreshRes.ok && refreshData.token) {
            session.token = refreshData.token;
            localStorage.setItem('orgcomms_session', JSON.stringify(session));
            first = await doFetch(session, path, opts);
          } else {
            localStorage.removeItem('orgcomms_session');
            location.reload();
            throw new Error('Session expired, please sign in again');

          throw e;
        }
      }
      if (!first.res.ok) throw new Error((first.data && first.data.error) || ('Request failed: ' + first.res.status));
      return first.data;
    }

    function renderLoginGate(){
      var existing = document.getElementById('oc-gate');
      if (existing) existing.remove();
      var root = document.getElementById('root');
      if (root) root.style.display = 'none';

      var gate = document.createElement('div');
      gate.id = 'oc-gate';
      document.body.appendChild(gate);

      function renderForm(mode, signupAvailable){
        var isSignup = mode === 'signup';
        gate.innerHTML =
          '<div class="oc-card">' +
            '<img src="/octave-logo.png" alt="Octave Growth Intelligence" class="oc-logo">' +
            '<h1>' + (isSignup ? 'Create Super Admin Account' : 'Sign In') + '</h1>' +
            '<p class="oc-sub">' + (isSignup ? 'One-time setup — this creates the first account and your tenant' : 'Sign in to your tenant') + '</p>' +
            '<form id="oc-auth-form">' +
              (isSignup ? '<label for="oc-company">Company Name</label><input id="oc-company" placeholder="Your company" required>' : '') +
              '<label for="oc-email">Email</label>' +
              '<input id="oc-email" type="email" required>' +
              '<label for="oc-password">Password</label>' +
              '<input id="oc-password" type="password" minlength="12" required>' +
              (isSignup ? '<label for="oc-password-confirm">Confirm Password</label><input id="oc-password-confirm" type="password" minlength="12" required>' : '') +
              (!isSignup ? '<div id="oc-totp-wrap" style="display:none"><label for="oc-totp">2FA Code</label><input id="oc-totp"></div>' : '') +
              '<button class="oc-primary" type="submit">' + (isSignup ? 'Create Account' : 'Sign In') + '</button>' +
              '<div class="oc-err" role="alert" aria-live="assertive" id="oc-err" style="display:none"></div>' +
            '</form>' +
            (signupAvailable ? '<p class="oc-switch"><a href="#" id="oc-switch-link">' + (isSignup ? 'Already have an account? Sign in' : 'First time here? Create the Super Admin account') + '</a></p>' : '') +
          '</div>';

        if (signupAvailable) {
          document.getElementById('oc-switch-link').addEventListener('click', function(ev){
            ev.preventDefault();
            renderForm(isSignup ? 'login' : 'signup', signupAvailable);
          });
        }

        document.getElementById('oc-auth-form').addEventListener('submit', async function(ev){
          ev.preventDefault();
          var apiBase = API_BASE;
          var email = document.getElementById('oc-email').value.trim();
          var password = document.getElementById('oc-password').value;
          var errEl = document.getElementById('oc-err');
          errEl.style.display = 'none';
          var btn = ev.target.querySelector('button');
          btn.disabled = true;
          try {
            var endpoint, body;
            if (isSignup) {
              var confirmPassword = document.getElementById('oc-password-confirm').value;
              if (password !== confirmPassword) throw new Error('Passwords do not match');
              endpoint = '/auth/signup';
              body = { email: email, password: password, company_name: document.getElementById('oc-company').value.trim() };
            } else {
              var totp = document.getElementById('oc-totp').value.trim();
              endpoint = '/auth/login';
              body = { email: email, password: password };
              if (totp) body.totp = totp;
            }
            var authRes = await fetch(apiBase.replace(/\/$/,'') + endpoint, {
              method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
            });
            var authData = await authRes.json();
            if (!authRes.ok) {
              if (!isSignup && authData && authData.need_2fa) {
                document.getElementById('oc-totp-wrap').style.display = 'block';
                throw new Error('Enter your 2FA code and sign in again');
              }
              throw new Error((authData && authData.error) || (isSignup ? 'Signup failed' : 'Login failed'));
            }
            var session = { apiBase: apiBase, token: authData.token, refresh: authData.refresh, user: authData.user, tenant: null };
            var tenantRes = await fetch(apiBase.replace(/\/$/,'') + '/tenants/me', { headers: { Authorization: 'Bearer ' + authData.token } });
            if (tenantRes.ok) session.tenant = await tenantRes.json();
            saveSession(session);
            location.reload();
          } catch(e){
            errEl.textContent = e.message;
            errEl.style.display = 'block';
            btn.disabled = false;
          }
        });
      }

      renderForm('login', false);
      fetch(API_BASE.replace(/\/$/,'') + '/auth/signup-status')
        .then(function(r){ return r.ok ? r.json() : { available: false }; })
        .then(function(status){ if (status.available) renderForm('login', true); })
        .catch(function(){});
    }

    function dismissOnboarding(session){

          '<h2 style="font-size:14px">' + esc(productName) + '</h2>' +
          '<div class="oc-tabs">' +

            '<button class="oc-tab" data-tab="channels">Channels</button>' +
            '<button class="oc-tab" data-tab="content">Content</button>' +
            '<button class="oc-tab" data-tab="agents">Agents</button>' +
          '</div>' +
          '<div id="oc-ptab-members"></div>' +
          '<div id="oc-ptab-channels" style="display:none"></div>' +
          '<div id="oc-ptab-content" style="display:none"></div>' +
          '<div id="oc-ptab-agents" style="display:none"></div>';

        document.getElementById('oc-back-to-list').addEventListener('click', loadList);
        body.querySelectorAll('.oc-tab').forEach(function(tab){
          tab.addEventListener('click', function(){
            body.querySelectorAll('.oc-tab').forEach(function(t){ t.classList.remove('oc-active'); });
            tab.classList.add('oc-active');
            document.getElementById('oc-ptab-members').style.display = tab.dataset.tab === 'members' ? 'block' : 'none';
            document.getElementById('oc-ptab-channels').style.display = tab.dataset.tab === 'channels' ? 'block' : 'none';
            document.getElementById('oc-ptab-content').style.display = tab.dataset.tab === 'content' ? 'block' : 'none';

        async function loadMembers(){
          var el = document.getElementById('oc-ptab-members');
          el.innerHTML = 'Loading&hellip;';
          try {
            var members = await api(session, '/products/' + productId + '/members');
            var canAdmin = isTenantAdmin || members.some(function(m){ return m.user_id === session.user.id && m.role === 'ADMIN'; });
            var rows = members.map(function(m){
              return '<tr><td>' + esc(m.email) + '</td><td>' + esc(m.role) + '</td><td>' + (canAdmin ? '<button class="oc-pbtn" data-uid="' + m.user_id + '">Remove</button>' : '') + '</td></tr>';
            }).join('');

            var pickerHtml = '<input name="user_id" placeholder="User ID" class="oc-full" required aria-label="User ID">';
            var tenantUsers = null;
            if (canAdmin && isTenantAdmin) {
              try { tenantUsers = await api(session, '/users'); } catch(e) { tenantUsers = null; }
            }
            if (tenantUsers) {
              pickerHtml = '<select name="user_id" class="oc-full" aria-label="User">' + tenantUsers.map(function(u){ return '<option value="' + u.id + '">' + esc(u.email) + ' (' + esc(u.role) + ')</option>'; }).join('') + '</select>';
            }

            el.innerHTML =
              '<table><tr><th>User</th><th>Role</th><th></th></tr>' + (rows || '<tr><td colspan="3" style="color:var(--oc-dim-5)">No members yet</td></tr>') + '</table>' +
              (canAdmin ?
                '<form id="oc-add-member">' +
                  '<label class="oc-full">Add Member</label>' +
                  pickerHtml +
                  '<select name="role" aria-label="Role"><option value="MEMBER">Member</option><option value="ADMIN">Product Admin</option></select>' +
                  '<button class="oc-submit" type="submit">Add</button>' +
                  '<div class="oc-msg oc-full" aria-live="polite" id="oc-member-msg"></div>' +
                '</form>' : '');

            el.querySelectorAll('.oc-pbtn').forEach(function(btn){
              btn.addEventListener('click', async function(){
                try { await api(session, '/products/' + productId + '/members/' + btn.dataset.uid, { method: 'DELETE' }); loadMembers(); }
                catch(e){ alert(e.message); }
              });
            });
            var form = document.getElementById('oc-add-member');
            if (form) form.addEventListener('submit', async function(ev){
              ev.preventDefault();
              var msg = document.getElementById('oc-member-msg');
              var fd = new FormData(ev.target);
              try {
                await api(session, '/products/' + productId + '/members', { method: 'POST', body: { user_id: fd.get('user_id'), role: fd.get('role') } });
                msg.className = 'oc-msg oc-ok'; msg.textContent = 'Added.';
                loadMembers();

            });
          } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + esc(e.message) + '</div>'; }
        }

        // Renders the channel-config fields for one channel into a
        // container element - shared by the wizard's config step.
        function renderChannelFields(spec, ch, existingConfig){
          var s = spec[ch];
          if (!s) return '';
          if (!s.implemented) {
            return '<div class="oc-help">' + (s.help || 'Not implemented yet.') + '</div>';
          }
          var existing = existingConfig || {};
          return (s.help ? '<div class="oc-help">' + s.help + '</div>' : '') +
            s.fields.map(function(f){
              var val = existing[f.key] || '';
              var isMasked = f.secret && val === '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022';
              return '<label for="oc-cf-' + f.key + '">' + f.label + (f.required ? ' *' : '') + '</label>' +
                '<input id="oc-cf-' + f.key + '" name="' + f.key + '" type="' + (f.secret ? 'password' : 'text') + '"' +
                (isMasked ? ' placeholder="Already set - leave blank to keep it"' : (val ? ' value="' + String(val).replace(/"/g,'&quot;') + '"' : '')) + '>';
            }).join('');
        }

        // A focused, two-step modal (pick a channel -> fill its fields) for
        // configuring one channel at a time, instead of a single dropdown +
        // form crammed into the tab (which also had a real usability bug -
        // native <select> option lists render inconsistently, sometimes
        // showing mostly blank rows, especially on mobile/some browsers).
        function openChannelWizard(spec, configured, onSaved){
          var existing = document.getElementById('oc-channel-wizard');
          if (existing) existing.remove();
          var modal = document.createElement('div');
          modal.id = 'oc-channel-wizard';
          modal.setAttribute('role', 'dialog');
          modal.setAttribute('aria-modal', 'true');
          document.body.appendChild(modal);

          function close(){ modal.remove(); }
          modal.addEventListener('click', function(ev){ if (ev.target === modal) close(); });

          function renderPicker(){
            var all = Object.keys(spec);
            modal.innerHTML =
              '<div class="oc-panel">' +
                '<button class="oc-close" id="oc-cw-close" aria-label="Close">&times;</button>' +
                '<h2>Configure a Channel</h2>' +
                '<p class="oc-sub">Pick a channel to connect. You can come back and edit any of these later.</p>' +
                '<div class="oc-chgrid">' +
                  all.map(function(ch){
                    var s = spec[ch];
                    var isConfigured = configured[ch] && configured[ch].status === 'configured';
                    var disabled = !s.implemented;
                    return '<button type="button" class="oc-chcard' + (disabled ? ' oc-disabled' : '') + '" data-ch="' + ch + '"' + (disabled ? ' disabled' : '') + '>' +
                      '<span class="oc-chname">' + s.label + '</span>' +
                      '<span class="oc-chstatus' + (isConfigured ? ' oc-configured' : '') + '">' + (disabled ? 'not available yet' : (isConfigured ? 'connected' : 'not connected')) + '</span>' +
                    '</button>';
                  }).join('') +
                '</div>' +
              '</div>';
            document.getElementById('oc-cw-close').addEventListener('click', close);
            modal.querySelectorAll('.oc-chcard:not(.oc-disabled)').forEach(function(card){
              card.addEventListener('click', function(){ renderForm(card.dataset.ch); });
            });
          }

          function renderForm(ch){
            var s = spec[ch];
            var existingConfig = (configured[ch] && configured[ch].config) || {};
            modal.innerHTML =
              '<div class="oc-panel">' +
                '<button class="oc-close" id="oc-cw-close" aria-label="Close">&times;</button>' +
                '<button type="button" class="oc-secondary" id="oc-cw-back" style="margin-bottom:14px;padding:6px 12px;font-size:12px">&larr; Back</button>' +
                '<h2>' + s.label + '</h2>' +
                '<form id="oc-cw-form">' +
                  renderChannelFields(spec, ch, existingConfig) +
                  '<div class="oc-row">' +
                    '<button type="submit" class="oc-primary">Save</button>' +
                  '</div>' +
                  '<div class="oc-err" role="alert" aria-live="assertive" id="oc-cw-err" style="display:none"></div>' +
                '</form>' +
              '</div>';
            document.getElementById('oc-cw-close').addEventListener('click', close);
            document.getElementById('oc-cw-back').addEventListener('click', renderPicker);
            var form = document.getElementById('oc-cw-form');
            if (form.querySelector('input')) {
              form.addEventListener('submit', async function(ev){
                ev.preventDefault();
                var err = document.getElementById('oc-cw-err');
                err.style.display = 'none';
                var fd = new FormData(ev.target);
                var config = {};
                s.fields.forEach(function(f){
                  var v = fd.get(f.key);
                  // Leave an unchanged secret alone (it renders as a masked
                  // placeholder, never as real input text) rather than
                  // overwriting a saved token with the literal mask string.
                  if (v !== null && v !== '') config[f.key] = v;
                });
                try {
                  await onSaved(ch, config);
                  close();
                } catch(e){ err.textContent = e.message; err.style.display = 'block'; }
              });
            } else {
              // Not-implemented channel: nothing to submit, just a way back.
              modal.querySelector('.oc-row').innerHTML = '';
            }
          }

          renderPicker();
        }

        async function loadChannels(){
          var el = document.getElementById('oc-ptab-channels');
          el.innerHTML = 'Loading&hellip;';
          try {
            var channels = await api(session, '/products/' + productId + '/channels');
            var spec = await api(session, '/channels/spec');
            var configured = {};
            channels.forEach(function(c){ configured[c.channel] = c; });
            var all = Object.keys(spec);
            var rows = all.map(function(ch){
              var st = configured[ch] ? configured[ch].status : 'not_configured';
              var label = (spec[ch] && spec[ch].label) || ch;
              return '<tr><td>' + label + '</td><td>' + st + '</td></tr>';
            }).join('');

            el.innerHTML =
              '<table><tr><th>Channel</th><th>Status</th></tr>' + rows + '</table>' +
              '<button class="oc-submit" id="oc-open-channel-wizard" type="button">Configure a Channel</button>';

            document.getElementById('oc-open-channel-wizard').addEventListener('click', function(){
              openChannelWizard(spec, configured, async function(ch, config){
                await api(session, '/products/' + productId + '/channels', { method: 'POST', body: { channel: ch, config: config } });
                loadChannels();
              });
            });
          } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + esc(e.message) + '</div>'; }
        }

        // Real content pipeline: upload -> generate per-channel variants ->
        // approve/reject. Replaces the old dead-end upload-only flow (the
        // separately-built widget this tab now supersedes) with the actual
        // API surface (POST /content/upload, POST /content/:assetId/transform,
        // POST /content/variants/:variantId/approve, GET /products/:id/content).
        var CONTENT_CHANNELS = ['whatsapp', 'facebook', 'instagram', 'linkedin', 'youtube', 'quora', 'email'];
        var canApproveContent = ['SUPER_ADMIN', 'APPROVER', 'DEPT_ADMIN', 'IT_ADMIN'].indexOf(session.user.role) !== -1 || !!session.user.can_approve_content;

        function fmtBytes(n){
          if (!n && n !== 0) return '';
          var units = ['B','KB','MB','GB']; var i = 0;
          while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
          return n.toFixed(i ? 1 : 0) + ' ' + units[i];
        }

        function renderVariantRow(v){
          var canAct = canApproveContent && v.status === 'PENDING_APPROVAL';
          return '<div class="oc-variant-row">' +
              '<div>' +
                '<span class="oc-variant-ch">' + esc(v.channel) + '</span>' +
                '<span class="oc-variant-spec">' + esc(v.spec || '') + (v.publish_error ? ' &middot; ' + esc(v.publish_error) : '') + '</span>' +
              '</div>' +
              '<div class="oc-variant-actions">' +
                '<span class="oc-status-pill oc-status-' + v.status + '">' + v.status.replace(/_/g,' ') + '</span>' +
                (canAct ?
                  '<button class="oc-vbtn oc-vbtn-approve" data-approve="' + v.id + '" type="button">Approve</button>' +
                  '<button class="oc-vbtn oc-vbtn-reject" data-reject="' + v.id + '" type="button">Reject</button>'
                  : '') +
              '</div>' +
            '</div>';
        }

        function renderAssetCard(a){
          var hasVariants = a.variants && a.variants.length > 0;
          return '<div class="oc-asset-card" data-asset="' + a.id + '">' +
              '<div class="oc-asset-head">' +
                '<div>' +
                  '<div class="oc-asset-name">' + esc(a.file_name) + '</div>' +
                  '<div class="oc-asset-meta">' + fmtBytes(a.file_size) + ' &middot; ' + esc(a.mime_type) + ' &middot; ' +
                    (a.virus_scan_status === 'CLEAN' ? 'scan clean' : '<span class="oc-scan-bad">' + a.virus_scan_status + '</span>') +
                  '</div>' +
                '</div>' +
              '</div>' +
              (hasVariants ?
                '<div class="oc-variant-list">' + a.variants.map(renderVariantRow).join('') + '</div>'
                : '<div class="oc-chpick" data-chpick="' + a.id + '">' +
                    CONTENT_CHANNELS.map(function(ch){ return '<label><input type="checkbox" value="' + ch + '"> ' + ch + '</label>'; }).join('') +
                  '</div>' +
                  '<button class="oc-gen-btn" data-generate="' + a.id + '" type="button">Generate Variants</button>') +
              '<div class="oc-msg" aria-live="polite" data-msg="' + a.id + '"></div>' +
            '</div>';
        }

        async function loadContent(){
          var el = document.getElementById('oc-ptab-content');
          el.innerHTML = 'Loading&hellip;';
          try {
            var assets = await api(session, '/products/' + productId + '/content');
            el.innerHTML =
              '<div class="oc-upload-row">' +
                '<input type="file" id="oc-content-file" aria-label="Choose a file to upload">' +
                '<button class="oc-gen-btn" id="oc-content-upload-btn" type="button">Upload</button>' +
              '</div>' +
              '<div class="oc-msg" aria-live="polite" id="oc-content-upload-msg"></div>' +
              (assets.length ?
                assets.map(renderAssetCard).join('')
                : '<div class="oc-msg" aria-live="polite" style="color:var(--oc-dim-5)">No content uploaded for this product yet.</div>');

            document.getElementById('oc-content-upload-btn').addEventListener('click', async function(){
              var input = document.getElementById('oc-content-file');
              var msg = document.getElementById('oc-content-upload-msg');
              if (!input.files || !input.files[0]) { msg.className = 'oc-msg oc-bad'; msg.textContent = 'Choose a file first.'; return; }
              var fd = new FormData();
              fd.append('file', input.files[0]);
              fd.append('product_id', productId);
              msg.className = 'oc-msg'; msg.textContent = 'Uploading&hellip;';
              try {
                await api(session, '/content/upload', { method: 'POST', body: fd });
                loadContent();
              } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
            });

            el.querySelectorAll('[data-generate]').forEach(function(btn){
              btn.addEventListener('click', async function(){
                var assetId = btn.dataset.generate;
                var picker = el.querySelector('[data-chpick="' + assetId + '"]');
                var msg = el.querySelector('[data-msg="' + assetId + '"]');
                var channels = Array.prototype.slice.call(picker.querySelectorAll('input:checked')).map(function(c){ return c.value; });
                if (!channels.length) { msg.className = 'oc-msg oc-bad'; msg.textContent = 'Pick at least one channel.'; return; }
                msg.className = 'oc-msg'; msg.textContent = 'Generating&hellip;';
                try {
                  await api(session, '/content/' + assetId + '/transform', { method: 'POST', body: { channels: channels } });
                  loadContent();
                } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
              });
            });

            el.querySelectorAll('[data-approve],[data-reject]').forEach(function(btn){
              btn.addEventListener('click', async function(){
                var variantId = btn.dataset.approve || btn.dataset.reject;
                var action = btn.dataset.approve ? 'APPROVE' : 'REJECT';
                try {
                  await api(session, '/content/variants/' + variantId + '/approve', { method: 'POST', body: { action: action } });
                  loadContent();
                } catch(e){ alert(e.message); }
              });
            });
          } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + esc(e.message) + '</div>'; }
        }

        async function loadProductAgents(){
          var el = document.getElementById('oc-ptab-agents');
          el.innerHTML = 'Loading&hellip;';
          try {
            var enabled = await api(session, '/products/' + productId + '/agents');
            var available = await api(session, '/agents');
            var rows = enabled.map(function(a){
              return '<tr><td>' + esc(a.name) + '</td><td>' + esc(a.model || '&mdash;') + '</td>' +
                '<td><button class="oc-run-agent" data-id="' + a.id + '" data-name="' + esc(a.name) + '">Run</button></td>' +
                '<td><button class="oc-view-runs" data-id="' + a.id + '">History</button></td>' +
                '<td><button class="oc-pbtn" data-id="' + a.id + '">Disable</button></td></tr>';
            }).join('');
            el.innerHTML =
              '<table><tr><th>Agent</th><th>Model</th><th></th><th></th><th></th></tr>' + (rows || '<tr><td colspan="5" style="color:var(--oc-dim-5)">No agents enabled — Premium plan only</td></tr>') + '</table>' +
              '<div id="oc-agent-runs"></div>' +
              (available.length ?
                '<form id="oc-enable-agent">' +
                  '<label class="oc-full">Enable an Agent</label>' +
                  '<select name="agent_id" class="oc-full" aria-label="Agent">' + available.map(function(a){ return '<option value="' + a.id + '">' + esc(a.name) + '</option>'; }).join('') + '</select>' +
                  '<button class="oc-submit" type="submit">Enable</button>' +
                  '<div class="oc-msg oc-full" aria-live="polite" id="oc-pagent-msg"></div>' +
                '</form>'
              : '<div class="oc-msg" aria-live="polite">No agents have been created yet — a Super Admin creates these under Admin &rarr; Agents.</div>');

            var runsBox = document.getElementById('oc-agent-runs');
            function renderRuns(agentId, runs){
              runsBox.innerHTML =
                '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--oc-dim-5);margin:16px 0 8px">Recent runs</h4>' +
                (runs.length ? runs.map(function(r){
                  return '<div style="border:1px solid var(--oc-border-08);border-radius:8px;padding:10px;margin-bottom:8px;font-size:12px">' +
                    '<div style="color:var(--oc-dim-5)">' + new Date(r.created_at).toLocaleString() + ' &middot; ' + esc(r.trigger_type) + ' &middot; <span style="color:' + (r.status==='SUCCESS'?'var(--oc-success)':'var(--oc-danger)') + '">' + esc(r.status) + '</span></div>' +
                    '<div style="margin-top:6px;white-space:pre-wrap">' + (r.status==='SUCCESS' ? esc(r.output_text||'') : ('Error: ' + esc(r.error||''))) + '</div>' +
                  '</div>';
                }).join('') : '<div class="oc-msg" aria-live="polite">No runs yet.</div>');
            }

            el.querySelectorAll('.oc-view-runs').forEach(function(btn){
              btn.addEventListener('click', async function(){
                try { renderRuns(btn.dataset.id, await api(session, '/products/' + productId + '/agents/' + btn.dataset.id + '/runs')); }
                catch(e){ alert(e.message); }
              });
            });
            el.querySelectorAll('.oc-run-agent').forEach(function(btn){
              btn.addEventListener('click', async function(){
                var leadId = prompt('Lead ID to run "' + btn.dataset.name + '" on (Cancel or leave blank to type free-form input instead):');
                var input = null;
                if (!leadId) {
                  input = prompt('Input for the agent (e.g. a message to draft a reply to):');
                  if (!input) return;
                }
                var origText = btn.textContent;
                btn.textContent = 'Running…'; btn.disabled = true;
                try {
                  var run = await api(session, '/products/' + productId + '/agents/' + btn.dataset.id + '/run', { method: 'POST', body: leadId ? { lead_id: leadId } : { input: input } });
                  renderRuns(btn.dataset.id, await api(session, '/products/' + productId + '/agents/' + btn.dataset.id + '/runs'));
                  if (run.status !== 'SUCCESS') alert('Agent run failed: ' + run.error);
                } catch(e){ alert(e.message); }
                finally { btn.textContent = origText; btn.disabled = false; }
              });
            });
            el.querySelectorAll('.oc-pbtn').forEach(function(btn){
              btn.addEventListener('click', async function(){
                try { await api(session, '/products/' + productId + '/agents/' + btn.dataset.id, { method: 'DELETE' }); loadProductAgents(); }
                catch(e){ alert(e.message); }
              });
            });
            var form = document.getElementById('oc-enable-agent');
            if (form) form.addEventListener('submit', async function(ev){
              ev.preventDefault();
              var msg = document.getElementById('oc-pagent-msg');
              var fd = new FormData(ev.target);
              try {
                await api(session, '/products/' + productId + '/agents', { method: 'POST', body: { agent_id: fd.get('agent_id') } });
                msg.className = 'oc-msg oc-ok'; msg.textContent = 'Enabled.';
                loadProductAgents();
              } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
            });
          } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + esc(e.message) + '</div>'; }
        }

        loadMembers();
      }

      loadList();
    }

    function renderAdmin(session){
      var existing = document.getElementById('oc-admin');
      if (existing) existing.remove();
      var isSuperAdmin = session.user.role === 'SUPER_ADMIN';
      var canSeeWebhooks = isSuperAdmin || session.user.role === 'IT_ADMIN';

        '<div class="oc-panel">' +
          '<button class="oc-close" id="oc-admin-close" aria-label="Close">&times;</button>' +

          '<div class="oc-tabs">' +
            (isSuperAdmin ? '<button class="oc-tab oc-active" data-tab="tenants">Tenants</button>' : '') +
            '<button class="oc-tab' + (isSuperAdmin ? '' : ' oc-active') + '" data-tab="users">Users</button>' +
            (canSeeWebhooks ? '<button class="oc-tab" data-tab="webhooks">Webhooks</button>' : '') +
            (isSuperAdmin ? '<button class="oc-tab" data-tab="agents">Agents</button>' : '') +
          '</div>' +
          '<div id="oc-tab-tenants" style="display:' + (isSuperAdmin ? 'block' : 'none') + '"></div>' +
          '<div id="oc-tab-users" style="display:' + (isSuperAdmin ? 'none' : 'block') + '"></div>' +
          '<div id="oc-tab-webhooks" style="display:none"></div>' +
          '<div id="oc-tab-agents" style="display:none"></div>' +
        '</div>';
      document.body.appendChild(wrap);
      document.getElementById('oc-admin-close').addEventListener('click', function(){ wrap.remove(); });

      wrap.querySelectorAll('.oc-tab').forEach(function(tab){
        tab.addEventListener('click', function(){
          wrap.querySelectorAll('.oc-tab').forEach(function(t){ t.classList.remove('oc-active'); });
          tab.classList.add('oc-active');

          document.getElementById('oc-tab-users').style.display = tab.dataset.tab === 'users' ? 'block' : 'none';
          document.getElementById('oc-tab-webhooks').style.display = tab.dataset.tab === 'webhooks' ? 'block' : 'none';
          document.getElementById('oc-tab-agents').style.display = tab.dataset.tab === 'agents' ? 'block' : 'none';
          if (tab.dataset.tab === 'agents' && isSuperAdmin) loadAgentsTab();
        });
      });

      var selectedTenantId = session.user.tenant_id;

      async function loadTenants(){
        var el = document.getElementById('oc-tab-tenants');
        el.innerHTML = 'Loading&hellip;';
        try {
          var tenants = await api(session, '/tenants');
          var rows = tenants.map(function(t){
            return '<tr><td>' + esc(t.name) + '</td><td>' + esc(t.subdomain) + '</td><td>' + esc(t.plan) + '</td>' +
              '<td><button class="oc-pick-tenant" data-id="' + t.id + '" data-name="' + esc(t.name) + '">Manage users</button></td></tr>';
          }).join('');
          el.innerHTML =
            '<table><tr><th>Name</th><th>Subdomain</th><th>Plan</th><th></th></tr>' + rows + '</table>' +
            '<form id="oc-create-tenant">' +
              '<label class="oc-full">Create Tenant</label>' +
              '<input name="name" placeholder="Tenant name" required aria-label="Tenant name">' +
              '<input name="subdomain" placeholder="subdomain" required aria-label="Subdomain">' +
              '<select name="plan" aria-label="Plan"><option value="starter">Starter</option><option value="premium">Premium</option></select>' +
              '<button class="oc-submit" type="submit">Create</button>' +
              '<div class="oc-msg oc-full" aria-live="polite" id="oc-tenant-msg"></div>' +
            '</form>';
          el.querySelectorAll('.oc-pick-tenant').forEach(function(btn){
            btn.addEventListener('click', function(){
              selectedTenantId = btn.dataset.id;
              wrap.querySelector('[data-tab="users"]').click();
              loadUsers();
            });
          });
          el.querySelector('#oc-create-tenant').addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-tenant-msg');
            var fd = new FormData(ev.target);
            try {
              await api(session, '/tenants', { method: 'POST', body: { name: fd.get('name'), subdomain: fd.get('subdomain'), plan: fd.get('plan') } });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Tenant created.';
              loadTenants();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + esc(e.message) + '</div>'; }
      }

      async function loadUsers(){
        var el = document.getElementById('oc-tab-users');
        el.innerHTML = 'Loading&hellip;';
        try {
          var roles = await api(session, '/roles');
          var qs = (isSuperAdmin && selectedTenantId) ? ('?tenant_id=' + encodeURIComponent(selectedTenantId)) : '';
          var users = await api(session, '/users' + qs);
          var roleOptions = roles.map(function(r){ return '<option value="' + esc(r.name) + '">' + esc(r.name) + '</option>'; }).join('');
          var rows = users.map(function(u){
            var isSelf = u.id === session.user.id;
            return '<tr><td>' + esc(u.email) + (u.disabled ? ' <span class="oc-badge oc-badge-bad">disabled</span>' : '') + '</td><td>' +
              '<select class="oc-role-select" data-id="' + u.id + '" aria-label="Role for ' + esc(u.email) + '">' +
                roles.map(function(r){ return '<option value="' + esc(r.name) + '"' + (r.name===u.role?' selected':'') + '>' + esc(r.name) + '</option>'; }).join('') +
              '</select></td><td><button class="oc-save-role" data-id="' + u.id + '">Save</button></td>' +
              '<td><button class="oc-toggle-status" data-id="' + u.id + '" data-disabled="' + !!u.disabled + '"' + (isSelf ? ' disabled title="You cannot disable your own account"' : '') + '>' + (u.disabled ? 'Enable' : 'Disable') + '</button></td>' +
              '<td><button class="oc-reset-pw" data-id="' + u.id + '" data-email="' + esc(u.email) + '">Reset Password</button></td></tr>';
          }).join('');
          el.innerHTML =
            (isSuperAdmin ? '<div class="oc-msg" aria-live="polite" style="margin-bottom:8px">Managing tenant: ' + (selectedTenantId || session.user.tenant_id) + '</div>' : '') +
            '<table><tr><th>Email</th><th>Role</th><th></th><th></th><th></th></tr>' + rows + '</table>' +
            '<form id="oc-create-user">' +
              '<label class="oc-full">Create User</label>' +
              '<input name="email" type="email" placeholder="email" required aria-label="Email">' +
              '<input name="password" type="password" placeholder="password (min 12 chars)" required minlength="12" aria-label="Password">' +
              '<select name="role" class="oc-full" aria-label="Role">' + roleOptions + '</select>' +
              '<button class="oc-submit" type="submit">Create</button>' +
              '<div class="oc-msg oc-full" aria-live="polite" id="oc-user-msg"></div>' +
            '</form>';
          el.querySelectorAll('.oc-save-role').forEach(function(btn){
            btn.addEventListener('click', async function(){
              var sel = el.querySelector('.oc-role-select[data-id="' + btn.dataset.id + '"]');
              try {
                await api(session, '/users/' + btn.dataset.id + '/role', { method: 'PATCH', body: { role: sel.value } });
                btn.textContent = 'Saved';
                setTimeout(function(){ btn.textContent = 'Save'; }, 1500);
              } catch(e){ alert(e.message); }
            });
          });
          el.querySelectorAll('.oc-toggle-status').forEach(function(btn){
            btn.addEventListener('click', async function(){
              var nextDisabled = btn.dataset.disabled !== 'true';
              if (nextDisabled && !confirm('Disable this user? They will be unable to log in until re-enabled.')) return;
              try {
                await api(session, '/users/' + btn.dataset.id + '/status', { method: 'PATCH', body: { disabled: nextDisabled } });
                loadUsers();
              } catch(e){ alert(e.message); }
            });
          });
          el.querySelectorAll('.oc-reset-pw').forEach(function(btn){
            btn.addEventListener('click', async function(){
              var pw = prompt('New password for ' + btn.dataset.email + ' (min 12 characters):');
              if (!pw) return;
              if (pw.length < 12) { alert('Password must be at least 12 characters.'); return; }
              try {
                await api(session, '/users/' + btn.dataset.id + '/reset-password', { method: 'POST', body: { new_password: pw } });
                alert('Password reset. Share the new password with ' + btn.dataset.email + ' through a secure channel.');
              } catch(e){ alert(e.message); }
            });
          });
          el.querySelector('#oc-create-user').addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-user-msg');
            var fd = new FormData(ev.target);
            var payload = { email: fd.get('email'), password: fd.get('password'), role: fd.get('role') };
            if (isSuperAdmin && selectedTenantId) payload.tenant_id = selectedTenantId;
            try {
              await api(session, '/users', { method: 'POST', body: payload });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'User created.';
              loadUsers();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + esc(e.message) + '</div>'; }
      }

      async function loadWebhooks(){
        var el = document.getElementById('oc-tab-webhooks');
        el.innerHTML = 'Loading&hellip;';
        try {
          var data = await api(session, '/integrations/webhook-urls');
          var rows = data.urls.map(function(u){
            return '<tr><td>' + u.channel + '</td><td><input readonly class="oc-webhook-url-input" value="' + u.url.replace(/"/g,'&quot;') + '" style="width:100%;font-size:11px" aria-label="Webhook URL for ' + u.channel + '"></td></tr>';
          }).join('');
          el.innerHTML =
            '<table><tr><th>Channel</th><th>Webhook URL</th></tr>' + rows + '</table>' +
            '<button class="oc-submit" id="oc-rotate-secret" style="max-width:220px">Rotate Secret</button>' +
            '<div class="oc-msg" aria-live="polite" id="oc-webhook-msg"></div>';
          Array.prototype.forEach.call(el.querySelectorAll('.oc-webhook-url-input'), function(inp){
            inp.addEventListener('click', function(){ inp.select(); });
          });
          el.querySelector('#oc-rotate-secret').addEventListener('click', async function(){
            if (!confirm('Rotating invalidates every URL above — every configured channel will need the new URL. Continue?')) return;
            var msg = document.getElementById('oc-webhook-msg');
            try {
              await api(session, '/integrations/webhook-secret/rotate', { method: 'POST' });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Rotated. URLs below are updated.';
              loadWebhooks();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){
          el.innerHTML = '<div class="oc-msg oc-bad">' + esc(e.message) + '<br>No secret yet? Rotate once to provision one.</div>' +
            '<button class="oc-submit" id="oc-rotate-secret" style="max-width:220px">Rotate Secret</button>';
          el.querySelector('#oc-rotate-secret').addEventListener('click', async function(){
            try { await api(session, '/integrations/webhook-secret/rotate', { method: 'POST' }); loadWebhooks(); } catch(e2){ alert(e2.message); }
          });
        }
      }

      async function loadAgentsTab(){
        var el = document.getElementById('oc-tab-agents');
        el.innerHTML = 'Loading&hellip;';
        try {
          var connections = await api(session, '/llm-connections');
          var agents = await api(session, '/agents');
          var connOptions = connections.map(function(c){ return '<option value="' + c.id + '">' + esc(c.name) + ' (' + esc(c.provider) + ')</option>'; }).join('');
          el.innerHTML =
            '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--oc-dim-5);margin:0 0 8px">LLM Connections</h4>' +
            '<table><tr><th>Name</th><th>Provider</th></tr>' + connections.map(function(c){ return '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.provider) + '</td></tr>'; }).join('') + '</table>' +
            '<form id="oc-create-connection">' +
              '<label class="oc-full">Add LLM Connection</label>' +
              '<input name="name" placeholder="Connection name" required aria-label="Connection name">' +
              '<select name="provider" id="oc-conn-provider" aria-label="Provider"><option value="anthropic">Anthropic (Claude)</option><option value="sarvam">Sarvam AI</option><option value="openai_compatible">OpenAI-compatible (Groq, Together, etc.)</option></select>' +
              '<input name="api_key" type="password" placeholder="API key" required aria-label="API key">' +
              '<input name="base_url" id="oc-conn-baseurl" placeholder="Base URL (e.g. https://api.groq.com/openai/v1)" class="oc-full" style="display:none" aria-label="Base URL">' +
              '<button class="oc-submit" type="submit">Add</button>' +
              '<div class="oc-msg oc-full" aria-live="polite" id="oc-connection-msg"></div>' +
            '</form>' +
            '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--oc-dim-5);margin:20px 0 8px">Agents</h4>' +
            '<table><tr><th>Name</th><th>Model</th><th>Active</th></tr>' + agents.map(function(a){ return '<tr><td>' + esc(a.name) + '</td><td>' + esc(a.model || '—') + '</td><td>' + (a.active ? 'Yes' : 'No') + '</td></tr>'; }).join('') + '</table>' +
            (connections.length ?
              '<form id="oc-create-agent">' +
                '<label class="oc-full">Create Agent</label>' +
                '<input name="name" placeholder="Agent name" required aria-label="Agent name">' +
                '<select name="llm_connection_id" class="oc-full" aria-label="LLM connection">' + connOptions + '</select>' +
                '<input name="model" placeholder="Model (e.g. claude-3-5-haiku-20241022, sarvam-105b, gpt-4o-mini) - leave blank for the connection\'s default" class="oc-full" aria-label="Model">' +
                '<textarea name="system_prompt" placeholder="System prompt" class="oc-full" style="grid-column:span 2;min-height:60px;padding:9px 10px;border-radius:8px;border:1px solid var(--oc-border-12);background:var(--oc-input-bg);color:var(--oc-text);font-size:13px;font-family:inherit"></textarea>' +
                '<button class="oc-submit" type="submit">Create</button>' +
                '<div class="oc-msg" aria-live="polite" id="oc-agent-msg"></div>' +
              '</form>'
            : '<div class="oc-msg" aria-live="polite" style="margin-top:8px">Add an LLM connection first before creating an agent.</div>');

          var connForm = document.getElementById('oc-create-connection');
          var providerSel = document.getElementById('oc-conn-provider');
          var baseUrlInput = document.getElementById('oc-conn-baseurl');
          function syncBaseUrlVisibility(){ baseUrlInput.style.display = providerSel.value === 'openai_compatible' ? '' : 'none'; }
          if (providerSel) { providerSel.addEventListener('change', syncBaseUrlVisibility); syncBaseUrlVisibility(); }
          if (connForm) connForm.addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-connection-msg');
            var fd = new FormData(ev.target);
            try {
              await api(session, '/llm-connections', { method: 'POST', body: { name: fd.get('name'), provider: fd.get('provider'), api_key: fd.get('api_key'), base_url: fd.get('base_url') } });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Connection added.';
              loadAgentsTab();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
          var agentForm = document.getElementById('oc-create-agent');
          if (agentForm) agentForm.addEventListener('submit', async function(ev){
            ev.preventDefault();
            var msg = document.getElementById('oc-agent-msg');
            var fd = new FormData(ev.target);
            try {
              await api(session, '/agents', { method: 'POST', body: { name: fd.get('name'), llm_connection_id: fd.get('llm_connection_id'), model: fd.get('model'), system_prompt: fd.get('system_prompt') } });
              msg.className = 'oc-msg oc-ok'; msg.textContent = 'Agent created.';
              loadAgentsTab();
            } catch(e){ msg.className = 'oc-msg oc-bad'; msg.textContent = e.message; }
          });
        } catch(e){ el.innerHTML = '<div class="oc-msg oc-bad">' + esc(e.message) + '</div>'; }
      }

      if (isSuperAdmin) loadTenants();
      loadUsers();
      if (canSeeWebhooks) loadWebhooks();
    }

    function boot(){
      var session = loadSession();
      if (!session || !session.token) {
        renderLoginGate();
      } else {
        renderBar(session);
        maybeShowOnboarding(session);
      }
    }

    // Exposed so the main app bundle's own event handlers (leads upload,
    // content upload, etc.) can make authenticated calls — same 401-refresh
    // retry logic as everything in this script, not a separate code path.
    window.__ORGCOMMS_API__ = function(path, opts){
      var session = loadSession();
      if (!session) { return Promise.reject(new Error('Not signed in')); }
      return api(session, path, opts);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
