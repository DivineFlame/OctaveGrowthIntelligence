networks:
  frontend:
  backend:
    internal: true
  db:
    internal: true
volumes:
  pgdata:
  redisdata:
  recordings:
  clamav_data:
  paperclip_cache:
services:
  clamav:
    image: clamav/clamav:latest
    container_name: orgcomms-clamav
    restart: unless-stopped
    networks: [backend]
    volumes:
      - clamav_data:/var/lib/clamav
  postgres:
    image: postgres:15-alpine
    container_name: orgcomms-postgres
    restart: unless-stopped
    networks: [db]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orgcomms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orgcomms_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-secure.sql:/docker-entrypoint-initdb.d/init-secure.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  redis:
    image: redis:7-alpine
    container_name: orgcomms-redis
    restart: unless-stopped
    networks: [db]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=50M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --bind 127.0.0.1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: orgcomms-api
    restart: unless-stopped
    networks: [frontend, backend, db]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=200M
      - /app/logs:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLAMAV_HOST: clamav
      # Server-to-server auth for hermes calling /internal/* routes directly
      # (no user JWT exists in that context) - see internalMiddleware.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      PAPERCLIP_SERVICE: paperclip-transformer:8000
      HERMES_MODE: premium_multiagent
    volumes:
      - recordings:/app/recordings
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
  hermes-orchestrator:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    container_name: orgcomms-hermes
    restart: unless-stopped
    networks: [backend, db]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAPERCLIP_SERVICE: paperclip-transformer:8000
      API_INTERNAL_URL: http://api:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
  paperclip-transformer:
    build:
      context: ./paperclip
      dockerfile: Dockerfile
    container_name: orgcomms-paperclip
    restart: unless-stopped
    networks: [backend]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=200M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - recordings:/app/recordings
      # persistent cache — this used to also be tmpfs-mounted at the same
      # path, which Docker Compose rejects (same bug already fixed in
      # docker-compose.dokploy.yml; this file just hadn't been updated to
      # match)
      - paperclip_cache:/app/cache
    # python:3.11-slim has no curl/wget by default, but does have python
    # itself, so use that to hit the real GET /health FastAPI already exposes.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  # csv-handler service removed: csv-handler.js only defined/exported
  # functions, never started a server or consumer loop, so it crash-looped
  # in production. That logic already lives inline in POST
  # /leads/upload-csv in api/src/server.js - the csv-handler/ directory
  # itself has been deleted (see docker-compose.dokploy.yml for the same
  # note, and the README's production audit section).
  transformer-worker:
    build:
      context: ./transformer
      dockerfile: Dockerfile
    container_name: orgcomms-transformer-worker
    restart: unless-stopped
    networks: [backend]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PAPERCLIP_SERVICE: paperclip-transformer:8000
    depends_on:
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orgcomms-frontend
    restart: unless-stopped
    networks: [frontend]
    ports:
      - "127.0.0.1:3005:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
