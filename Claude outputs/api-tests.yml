# Two jobs:
#   - `test`: api/test/*.test.js (80 tests as of this writing, Node's
#     built-in node:test - see api/test/ and README.md "Hardening notes").
#     Pure-function/mocked-client unit tests, no external dependency by
#     design - this is the same suite api/Dockerfile already runs at image
#     build time (`RUN npm test`), so it was already a hard gate on
#     deploy; running it here just moves that same check onto every PR,
#     before a broken change is even merged.
#   - `integration-test`: api/test/integration/routes.integration.js
#     against REAL Postgres + Redis service containers - RLS tenant
#     isolation, the audit_logs immutability trigger, Redis-backed rate
#     limit enforcement, the real migration chain, and the GDPR
#     export/erasure routes actually mutating a real database. See that
#     file's own header comment and README.md's "Testing" section for why
#     this exists as a separate job/file rather than folded into `test` -
#     short version: it needs real services `test` deliberately doesn't.
name: API tests

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'postgres/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'postgres/**'
      - '.github/workflows/api-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - run: npm test

  integration-test:
    runs-on: ubuntu-latest
    services:
      # Same major versions docker-compose.vps.yml actually deploys
      # (postgres:15-alpine, redis:7-alpine) - this job is only worth
      # running if it reflects production, not whatever's newest.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: orgcomms_test
          POSTGRES_PASSWORD: orgcomms_test_ci_password
          POSTGRES_DB: orgcomms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgres://orgcomms_test:orgcomms_test_ci_password@localhost:5432/orgcomms_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      # Same two-step schema setup a real deploy gets: init-secure.sql
      # once (normally applied via Postgres's docker-entrypoint-initdb.d
      # mount - a bare service container has no equivalent, so it's run
      # explicitly here), then every postgres/migrate-*.sql via the app's
      # own migrate.js, in the exact order/mechanism a real deploy uses -
      # this job is exercising the real migration path, not a shortcut
      # around it.
      - name: Apply schema (init-secure.sql)
        run: PGPASSWORD=orgcomms_test_ci_password psql -h localhost -U orgcomms_test -d orgcomms_test -f ../postgres/init-secure.sql

      - name: Apply migrations (migrate.js)
        run: node src/migrate.js
        env:
          MIGRATIONS_DIR: ../postgres

      - run: npm run test:integration
